server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HashRouter means every real route is served from index.html anyway
    # (paths look like /#/dashboard), but this keeps direct hits on
    # unknown paths from 404ing too.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
